openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Watchlist API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: User authentication operations
  - name: items
    description: Watchlist item operations
  - name: stats
    description: Watchlist statistics
  - name: tmdb
    description: TMDB title search and watch providers
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input or user already exists

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with username or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Successfully logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          description: Not authenticated

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean

  /items:
    get:
      operationId: listItems
      tags: [items]
      summary: List watchlist items with search, filter, sort and pagination
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [want_to_watch, watching, watched]
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, series]
        - name: genre
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [updatedAt, createdAt, title, year, rating]
            default: updatedAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: Paginated watchlist items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedWatchlistItems"
    post:
      operationId: createItem
      tags: [items]
      summary: Add item to watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"
        "400":
          description: Bad request or validation error
        "409":
          description: Duplicate item already in watchlist

  /items/{id}:
    get:
      operationId: getItem
      tags: [items]
      summary: Get a single watchlist item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Watchlist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"
        "400":
          description: Invalid ID
        "404":
          description: Not found
    patch:
      operationId: updateItem
      tags: [items]
      summary: Update a watchlist item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistItemUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"
        "400":
          description: Bad request
        "404":
          description: Not found
    delete:
      operationId: deleteItem
      tags: [items]
      summary: Remove item from watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid ID
        "404":
          description: Not found

  /items/{id}/refresh:
    post:
      operationId: refreshItemFromTmdb
      tags: [items]
      summary: Refresh item details from TMDB
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Refreshed item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"
        "400":
          description: Item does not have a TMDB ID
        "404":
          description: Item not found
        "502":
          description: Failed to fetch from TMDB

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get watchlist statistics
      responses:
        "200":
          description: Watchlist stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistStats"

  /items/recent:
    get:
      operationId: getRecentItems
      tags: [items]
      summary: Get recently added or updated items
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 6
      responses:
        "200":
          description: Recent items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"

  /watchlist/export:
    get:
      operationId: exportWatchlist
      tags: [items]
      summary: Export all watchlist items for the authenticated user
      responses:
        "200":
          description: Watchlist items export
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"

  /watchlist/import:
    post:
      operationId: importWatchlist
      tags: [items]
      summary: Import watchlist items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/WatchlistItemInput"
      responses:
        "200":
          description: Import results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"

  /tmdb/search:
    get:
      operationId: searchTmdb
      tags: [tmdb]
      summary: Search TMDB for movies and series
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, series]
      responses:
        "200":
          description: Matching TMDB titles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TmdbSearchResult"
        "400":
          description: Invalid search query
        "429":
          description: Rate limit exceeded
        "503":
          description: TMDB integration is not configured
        "502":
          description: TMDB request failed

  /tmdb/providers/{type}/{id}:
    get:
      operationId: getWatchProviders
      tags: [tmdb]
      summary: Get watch providers (streaming, rent, buy) from TMDB
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [movie, series]
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Watch providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchProvidersResponse"
        "400":
          description: Invalid ID or type
        "429":
          description: Rate limit exceeded
        "502":
          description: TMDB request failed

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RegisterInput:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    LoginInput:
      type: object
      required:
        - usernameOrEmail
        - password
      properties:
        usernameOrEmail:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    UserInfo:
      type: object
      required:
        - id
        - username
        - email
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string

    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserInfo"

    WatchlistItem:
      type: object
      required:
        - id
        - title
        - type
        - status
        - seasonProgress
        - episodeProgress
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        tmdbId:
          type: ["integer", "null"]
        title:
          type: string
        type:
          type: string
          enum: [movie, series]
        genre:
          type: ["string", "null"]
        year:
          type: ["integer", "null"]
        posterUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [want_to_watch, watching, watched]
        rating:
          type: ["integer", "null"]
          minimum: 1
          maximum: 10
        notes:
          type: ["string", "null"]
        seasonProgress:
          type: integer
        episodeProgress:
          type: integer
        totalSeasons:
          type: ["integer", "null"]
        totalEpisodes:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginatedWatchlistItems:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistItem"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer

    WatchlistItemInput:
      type: object
      required:
        - title
        - type
      properties:
        title:
          type: string
          minLength: 1
        type:
          type: string
          enum: [movie, series]
        genre:
          type: string
        year:
          type: integer
        posterUrl:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [want_to_watch, watching, watched]
          default: want_to_watch
        rating:
          type: integer
          minimum: 1
          maximum: 10
        notes:
          type: string
        tmdbId:
          type: integer
        seasonProgress:
          type: integer
          default: 1
        episodeProgress:
          type: integer
          default: 0
        totalSeasons:
          type: integer
        totalEpisodes:
          type: integer

    WatchlistItemUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        type:
          type: string
          enum: [movie, series]
        genre:
          type: string
        year:
          type: integer
        posterUrl:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [want_to_watch, watching, watched]
        rating:
          type: integer
          minimum: 1
          maximum: 10
        notes:
          type: string
        tmdbId:
          type: integer
        seasonProgress:
          type: integer
        episodeProgress:
          type: integer
        totalSeasons:
          type: integer
        totalEpisodes:
          type: integer

    WatchlistStats:
      type: object
      required:
        - total
        - byStatus
        - byType
      properties:
        total:
          type: integer
        byStatus:
          type: object
          required:
            - want_to_watch
            - watching
            - watched
          properties:
            want_to_watch:
              type: integer
            watching:
              type: integer
            watched:
              type: integer
        byType:
          type: object
          required:
            - movie
            - series
          properties:
            movie:
              type: integer
            series:
              type: integer
        averageRating:
          type: ["number", "null"]

    TmdbSearchResult:
      type: object
      required:
        - id
        - title
        - type
        - year
        - posterUrl
        - description
        - genre
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
          enum: [movie, series]
        year:
          type: ["integer", "null"]
        posterUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        genre:
          type: ["string", "null"]

    WatchProvider:
      type: object
      required:
        - name
      properties:
        providerId:
          type: integer
        name:
          type: string
        logoUrl:
          type: ["string", "null"]

    WatchProvidersResponse:
      type: object
      required:
        - tmdbId
      properties:
        tmdbId:
          type: integer
        link:
          type: ["string", "null"]
        streaming:
          type: array
          items:
            $ref: "#/components/schemas/WatchProvider"
        rent:
          type: array
          items:
            $ref: "#/components/schemas/WatchProvider"
        buy:
          type: array
          items:
            $ref: "#/components/schemas/WatchProvider"

    ImportResponse:
      type: object
      required:
        - imported
        - skipped
        - total
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        total:
          type: integer
