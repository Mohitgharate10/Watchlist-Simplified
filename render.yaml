services:
  - type: web
  - name: watchlist-simplified
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run db:migrate; pnpm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: watchlist-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: TMDB_API_KEY
        sync: false

databases:
  - name: watchlist-db
    plan: free
